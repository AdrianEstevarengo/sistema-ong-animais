{% extends 'painel/base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
    <div class="card shadow-sm"><div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Entrar no sistema</h1>
        {% if form.errors %}<div class="alert alert-danger">Usuário ou senha incorretos.</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label" for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username" class="form-control" autofocus required></div>
            <div class="mb-3"><label class="form-label" for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" class="form-control" required></div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-success w-100">Entrar</button>
        </form>
    </div></div>
</div></div>
{% endblock %}
