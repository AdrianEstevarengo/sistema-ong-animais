
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animais para Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4">🐾 Animais para Adoção</h1>

    <form method="GET" class="row g-3 mb-4">
        <div class="col-md-3">
            <select name="especie" class="form-select">
                <option value="">Todas as espécies</option>
                <option value="Cachorro" {% if request.GET.especie == 'Cachorro' %}selected{% endif %}>Cachorro</option>
                <option value="Gato" {% if request.GET.especie == 'Gato' %}selected{% endif %}>Gato</option>
            </select>
        </div>

        <div class="col-md-3">
            <select name="porte" class="form-select">
                <option value="">Todos os portes</option>
                <option value="Pequeno" {% if request.GET.porte == 'Pequeno' %}selected{% endif %}>Pequeno</option>
                <option value="Médio" {% if request.GET.porte == 'Médio' %}selected{% endif %}>Médio</option>
                <option value="Grande" {% if request.GET.porte == 'Grande' %}selected{% endif %}>Grande</option>
            </select>
        </div>

        <div class="col-md-3">
            <select name="status" class="form-select">
                <option value="">Todas as situações</option>
                <option value="Disponível" {% if request.GET.status == 'Disponível' %}selected{% endif %}>Disponível</option>
                <option value="Adotado" {% if request.GET.status == 'Adotado' %}selected{% endif %}>Adotado</option>
                <option value="Em tratamento" {% if request.GET.status == 'Em tratamento' %}selected{% endif %}>Em tratamento</option>
            </select>
        </div>

        <div class="col-md-3">
            <button type="submit" class="btn btn-success w-100">Filtrar</button>
        </div>
    </form>

    <div class="row g-4">
        {% for animal in animais %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                {% if animal.foto %}
                <img src="{{ animal.foto.url }}" class="card-img-top"
                     style="height: 220px; object-fit: cover;" alt="{{ animal.nome }}">
                {% endif %}

                <div class="card-body">
                    <h5 class="card-title">{{ animal.nome }}</h5>
                    <p class="card-text">
                        Espécie: {{ animal.especie }}<br>
                        Raça: {{ animal.raca }}<br>
                        Porte: {{ animal.porte }}<br>
                        Situação: {{ animal.status }}
                    </p>
                </div>
            </div>
        </div>
        {% empty %}
        <p>Nenhum animal encontrado.</p>
        {% endfor %}
    </div>
</div>

</body>
</html>
